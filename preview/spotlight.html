<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2 · Spotlight Reveal — Photo Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --cream:#F2F0E9; --ink:#111111; --purple:#7A6CFF; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--cream); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:28px 20px 48px;
  }
  .preview-nav {
    display:flex; gap:6px; flex-wrap:wrap; justify-content:center;
    background:#fff; border:1px solid #e3e0d6; border-radius:999px; padding:6px;
    box-shadow:0 2px 10px rgba(17,17,17,.06); margin-bottom:36px;
  }
  .preview-nav a {
    text-decoration:none; color:var(--ink); font-size:13px; font-weight:600;
    padding:8px 16px; border-radius:999px; transition:background .2s,color .2s;
  }
  .preview-nav a:hover { background:#efece3; }
  .preview-nav a.active { background:var(--ink); color:#fff; }
  header { text-align:center; margin-bottom:32px; }
  header h1 {
    font-family:'Space Grotesk',sans-serif; font-size:clamp(30px,5vw,44px);
    font-weight:700; letter-spacing:-.02em; line-height:1.05;
  }
  header h1 span { color:var(--purple); }
  header p { margin-top:10px; font-size:16px; color:#55534c; max-width:520px; }
  .spot-wrap {
    position:relative; width:min(400px,86vw); aspect-ratio:1/1;
    border-radius:24px; overflow:hidden; cursor:none;
    box-shadow:0 24px 60px rgba(17,17,17,.22), 0 4px 14px rgba(17,17,17,.12);
    touch-action:none;
  }
  .spot-wrap img {
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    display:block; user-select:none; -webkit-user-drag:none;
  }
  .spot-grey {
    filter:grayscale(1) brightness(0.55);
    -webkit-mask-image:radial-gradient(circle 140px at var(--sx,50%) var(--sy,50%),
      transparent 0, transparent 55%, #000 100%);
    mask-image:radial-gradient(circle 140px at var(--sx,50%) var(--sy,50%),
      transparent 0, transparent 55%, #000 100%);
  }
  .hint { margin-top:26px; font-size:13px; color:#77756c; text-align:center; }
  .note { margin-top:8px; font-size:12px; color:#a09d92; text-align:center; }
  @media (hover:none) {
    .spot-wrap { cursor:default; }
  }
  @media (prefers-reduced-motion:reduce) {
    .spot-grey { display:none; } /* full-colour photo, no spotlight */
    .spot-wrap { cursor:default; }
  }
</style>
</head>
<body>
  <nav class="preview-nav" aria-label="Photo previews">
    <a href="holo.html">1 · Holo Tilt</a>
    <a href="spotlight.html" class="active" aria-current="page">2 · Spotlight</a>
    <a href="slices.html">3 · Slices</a>
  </nav>

  <header>
    <h1>Spotlight <span>Reveal</span></h1>
    <p>The photo starts grey and dim — move your cursor and a spotlight reveals it in full colour.</p>
  </header>

  <div class="spot-wrap" id="spotWrap">
    <img class="spot-base" src="../assets/avatar.jpg" alt="" aria-hidden="true" draggable="false">
    <img class="spot-grey" id="spotGrey" src="../assets/avatar.jpg" alt="Adarsh Tripathi" draggable="false">
  </div>

  <p class="hint">Desktop: move your cursor over the photo &nbsp;·&nbsp; Touch: the spotlight drifts on its own.</p>
  <p class="note">Preview only — pick one and it will replace the About photo.</p>

<script>
(function () {
  var wrap = document.getElementById('spotWrap');
  var grey = document.getElementById('spotGrey');
  var fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) return; // CSS hides the grey layer: full-colour photo, no spotlight

  function setSpot(x, y) {
    grey.style.setProperty('--sx', x + 'px');
    grey.style.setProperty('--sy', y + 'px');
  }

  if (fine) {
    wrap.addEventListener('mousemove', function (e) {
      var r = wrap.getBoundingClientRect();
      setSpot(e.clientX - r.left, e.clientY - r.top);
    });
    wrap.addEventListener('mouseleave', function () {
      var r = wrap.getBoundingClientRect();
      setSpot(r.width / 2, r.height / 2);
    });
  } else {
    // No mouse: the spotlight drifts slowly on its own (Lissajous path).
    var t0 = performance.now();
    (function drift(now) {
      var t = (now - t0) / 1000;
      var r = wrap.getBoundingClientRect();
      var x = r.width * (0.5 + 0.32 * Math.sin(t * 0.45));
      var y = r.height * (0.5 + 0.32 * Math.sin(t * 0.31 + 1.4));
      setSpot(x, y);
      requestAnimationFrame(drift);
    })(t0);
  }
})();
</script>
</body>
</html>
